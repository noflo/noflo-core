topic: core/RepeatAsync
cases:
  - name: sending a string
    assertion: should repeat it on the next tick
    inputs:
      in: hello
    expect:
      out:
        equals: hello
topic: core/RepeatDelayed
cases:
  - name: sending a boolean
    assertion: should repeat the same
    timeout: 3000
    inputs:
      delay: 100
      in: true
    expect:
      out:
        equals: true
  - name: sending a string
    assertion: should repeat the same
    timeout: 3000
    inputs:
      delay: 100
      in: my string
    expect:
      out:
        equals: my string
